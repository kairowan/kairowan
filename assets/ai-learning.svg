<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">AI learning and practice</title>
  <desc id="desc">An animated network connecting large language models, retrieval augmented generation, agents, multimodal AI, Go services, and JavaScript interfaces.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091a18" />
      <stop offset="0.52" stop-color="#111d32" />
      <stop offset="1" stop-color="#22183a" />
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84" />
      <stop offset="0.5" stop-color="#73a7ff" />
      <stop offset="1" stop-color="#b47cff" />
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#73a7ff" stop-opacity="0.55" />
      <stop offset="0.65" stop-color="#3ddc84" stop-opacity="0.12" />
      <stop offset="1" stop-color="#3ddc84" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#d8e9ff" stroke-opacity="0.055" />
    </pattern>

    <path id="to-llm" d="M390 146 C300 110 250 88 205 91" />
    <path id="to-rag" d="M392 190 C300 205 250 228 205 231" />
    <path id="to-agent" d="M510 146 C600 110 650 88 695 91" />
    <path id="to-multimodal" d="M508 190 C600 205 650 228 695 231" />
    <path id="to-go" d="M424 226 C390 259 370 278 350 291" />
    <path id="to-js" d="M476 226 C510 259 530 278 550 291" />
  </defs>

  <rect width="900" height="350" rx="24" fill="url(#background)" />
  <rect width="900" height="350" rx="24" fill="url(#grid)" />
  <rect x="1" y="1" width="898" height="348" rx="23" fill="none" stroke="#73a7ff" stroke-opacity="0.22" />

  <g fill="none" stroke="url(#spectrum)" stroke-width="2" stroke-dasharray="6 8" stroke-linecap="round" opacity="0.75">
    <use href="#to-llm"><animate attributeName="stroke-dashoffset" values="28;0" dur="2.8s" repeatCount="indefinite" /></use>
    <use href="#to-rag"><animate attributeName="stroke-dashoffset" values="0;28" dur="3.2s" repeatCount="indefinite" /></use>
    <use href="#to-agent"><animate attributeName="stroke-dashoffset" values="28;0" dur="3s" repeatCount="indefinite" /></use>
    <use href="#to-multimodal"><animate attributeName="stroke-dashoffset" values="0;28" dur="3.4s" repeatCount="indefinite" /></use>
    <use href="#to-go"><animate attributeName="stroke-dashoffset" values="28;0" dur="2.6s" repeatCount="indefinite" /></use>
    <use href="#to-js"><animate attributeName="stroke-dashoffset" values="0;28" dur="2.9s" repeatCount="indefinite" /></use>
  </g>

  <circle cx="450" cy="170" r="112" fill="url(#core)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="450" cy="170" r="76" fill="#101f2b" stroke="url(#spectrum)" stroke-width="2" />
  <circle cx="450" cy="170" r="88" fill="none" stroke="#73a7ff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 10">
    <animateTransform attributeName="transform" type="rotate" from="0 450 170" to="360 450 170" dur="16s" repeatCount="indefinite" />
  </circle>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="450" y="159" fill="#f4f8ff" font-size="21" font-weight="700" letter-spacing="3">AI PRACTICE</text>
    <text x="450" y="185" fill="#9fb9ca" font-size="11" letter-spacing="1.5">UNDERSTAND · BUILD</text>
    <text x="450" y="203" fill="#9fb9ca" font-size="11" letter-spacing="1.5">EVALUATE · ITERATE</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(55 62)">
      <rect width="150" height="58" rx="14" fill="#102b24" stroke="#3ddc84" stroke-opacity="0.65" />
      <circle cx="22" cy="20" r="5" fill="#3ddc84" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="2.2s" repeatCount="indefinite" /></circle>
      <text x="38" y="25" fill="#3ddc84" font-size="15" font-weight="700">LLM</text>
      <text x="15" y="46" fill="#9bbcaf" font-size="10">Reason · Prompt · Eval</text>
    </g>
    <g transform="translate(55 202)">
      <rect width="150" height="58" rx="14" fill="#102b24" stroke="#3ddc84" stroke-opacity="0.65" />
      <circle cx="22" cy="20" r="5" fill="#3ddc84" filter="url(#glow)"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.5s" repeatCount="indefinite" /></circle>
      <text x="38" y="25" fill="#3ddc84" font-size="15" font-weight="700">RAG</text>
      <text x="15" y="46" fill="#9bbcaf" font-size="10">Embed · Retrieve · Ground</text>
    </g>
    <g transform="translate(695 62)">
      <rect width="150" height="58" rx="14" fill="#1a2740" stroke="#73a7ff" stroke-opacity="0.65" />
      <circle cx="22" cy="20" r="5" fill="#73a7ff" filter="url(#glow)"><animate attributeName="r" values="7;4;7" dur="2.7s" repeatCount="indefinite" /></circle>
      <text x="38" y="25" fill="#73a7ff" font-size="15" font-weight="700">AGENTS</text>
      <text x="15" y="46" fill="#9db3d1" font-size="10">Tools · Memory · Flow</text>
    </g>
    <g transform="translate(695 202)">
      <rect width="150" height="58" rx="14" fill="#241c3d" stroke="#b47cff" stroke-opacity="0.65" />
      <circle cx="22" cy="20" r="5" fill="#b47cff" filter="url(#glow)"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite" /></circle>
      <text x="38" y="25" fill="#b47cff" font-size="14" font-weight="700">MULTIMODAL</text>
      <text x="15" y="46" fill="#b3a2ca" font-size="10">Text · Image · Audio</text>
    </g>
    <g transform="translate(270 286)">
      <rect width="160" height="42" rx="13" fill="#102936" stroke="#00add8" stroke-opacity="0.7" />
      <text x="80" y="26" text-anchor="middle" fill="#63d8f5" font-size="13" font-weight="700">GO · AI SERVICES</text>
    </g>
    <g transform="translate(470 286)">
      <rect width="160" height="42" rx="13" fill="#302d1a" stroke="#f7df1e" stroke-opacity="0.7" />
      <text x="80" y="26" text-anchor="middle" fill="#f7df1e" font-size="13" font-weight="700">JS · AI INTERFACES</text>
    </g>
  </g>

  <g fill="#ffffff" filter="url(#glow)">
    <circle r="3"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#to-llm" /></animateMotion></circle>
    <circle r="3"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#to-agent" /></animateMotion></circle>
    <circle r="3"><animateMotion dur="3.8s" repeatCount="indefinite"><mpath href="#to-rag" /></animateMotion></circle>
  </g>
</svg>
