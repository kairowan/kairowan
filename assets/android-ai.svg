<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
  <title id="title">Android AI animated banner</title>
  <desc id="desc">An animated circuit connecting Android development with on-device artificial intelligence.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b17" />
      <stop offset="0.55" stop-color="#0b2720" />
      <stop offset="1" stop-color="#10243b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84" />
      <stop offset="1" stop-color="#73a7ff" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#3ddc84" stop-opacity="0.65" />
      <stop offset="1" stop-color="#3ddc84" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#bcefd2" stroke-opacity="0.07" />
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <path id="signal-path" d="M126 122 C230 40 315 198 430 116 S650 50 778 120" />
  </defs>

  <rect width="900" height="240" rx="24" fill="url(#background)" />
  <rect width="900" height="240" rx="24" fill="url(#grid)" />
  <circle cx="120" cy="120" r="105" fill="url(#glow)" opacity="0.5">
    <animate attributeName="opacity" values="0.25;0.65;0.25" dur="4s" repeatCount="indefinite" />
  </circle>

  <g fill="none" stroke="url(#accent)" stroke-linecap="round">
    <use href="#signal-path" stroke-width="2.5" stroke-opacity="0.65" />
    <path d="M126 122 C230 204 310 40 430 116 S650 194 778 120" stroke-width="1.5" stroke-opacity="0.25" />
  </g>

  <g fill="#3ddc84" filter="url(#soft-glow)">
    <circle cx="126" cy="122" r="6">
      <animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="430" cy="116" r="6">
      <animate attributeName="r" values="7;4;7" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="778" cy="120" r="6">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle r="5" fill="#ffffff">
      <animateMotion dur="3.8s" repeatCount="indefinite" rotate="auto">
        <mpath href="#signal-path" />
      </animateMotion>
    </circle>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="450" y="106" fill="#f4fff8" font-size="38" font-weight="700" letter-spacing="5">ANDROID × AI</text>
    <text x="450" y="145" fill="#a7c8bb" font-size="15" letter-spacing="2">ON-DEVICE INFERENCE · AUDIO · PERFORMANCE</text>
  </g>

  <g fill="#071b17" stroke="#3ddc84" stroke-width="2">
    <rect x="92" y="95" width="68" height="54" rx="14" />
    <path d="M105 95 97 82M147 95l8-13" />
    <circle cx="112" cy="113" r="3" fill="#3ddc84" stroke="none" />
    <circle cx="140" cy="113" r="3" fill="#3ddc84" stroke="none" />
  </g>

  <g transform="translate(778 120)" fill="none" stroke="#73a7ff" stroke-width="2">
    <circle r="31" />
    <circle r="18" stroke-opacity="0.65">
      <animate attributeName="r" values="15;22;15" dur="3s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.9;0.2;0.9" dur="3s" repeatCount="indefinite" />
    </circle>
    <path d="M-31 0h-13M31 0h13M0-31v-13M0 31v13" />
  </g>

  <rect x="1" y="1" width="898" height="238" rx="23" fill="none" stroke="#3ddc84" stroke-opacity="0.22" />
</svg>
