<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="title desc">
  <title id="title">Build, learn, share</title>
  <desc id="desc">Animated green, blue, and violet waves surrounding the words Build, Learn, Share.</desc>

  <defs>
    <linearGradient id="wave-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84" stop-opacity="0" />
      <stop offset="0.5" stop-color="#3ddc84" stop-opacity="0.72" />
      <stop offset="1" stop-color="#73a7ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="wave-b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#73a7ff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#b47cff" stop-opacity="0.5" />
      <stop offset="1" stop-color="#3ddc84" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="150" rx="22" fill="#091b18" />
  <path d="M-120 83 C20 28 140 133 290 77 S560 28 720 81 S970 130 1040 67" fill="none" stroke="url(#wave-a)" stroke-width="3">
    <animateTransform attributeName="transform" type="translate" values="0 0;70 0;0 0" dur="6s" repeatCount="indefinite" />
  </path>
  <path d="M-140 96 C10 151 150 42 300 99 S575 145 730 91 S965 48 1060 101" fill="none" stroke="url(#wave-b)" stroke-width="2">
    <animateTransform attributeName="transform" type="translate" values="60 0;0 0;60 0" dur="7s" repeatCount="indefinite" />
  </path>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" filter="url(#glow)">
    <text x="450" y="71" fill="#f1fff7" font-size="24" font-weight="700" letter-spacing="5">BUILD · LEARN · SHARE</text>
    <text x="450" y="101" fill="#84ad9d" font-size="12" letter-spacing="2">KEEP CREATING USEFUL THINGS</text>
  </g>

  <circle cx="262" cy="63" r="3" fill="#3ddc84">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="638" cy="63" r="3" fill="#73a7ff">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <rect x="1" y="1" width="898" height="148" rx="21" fill="none" stroke="#3ddc84" stroke-opacity="0.18" />
</svg>
