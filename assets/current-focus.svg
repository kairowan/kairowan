<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
  <title id="title">Current focus</title>
  <desc id="desc">Animated cards for on-device AI, audio intelligence, and Android performance.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081b18" />
      <stop offset="1" stop-color="#101c31" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84" />
      <stop offset="0.5" stop-color="#73a7ff" />
      <stop offset="1" stop-color="#b47cff" />
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d2f7e2" opacity="0.09" />
    </pattern>
  </defs>

  <rect width="900" height="270" rx="24" fill="url(#panel)" />
  <rect width="900" height="270" rx="24" fill="url(#dots)" />
  <rect x="1" y="1" width="898" height="268" rx="23" fill="none" stroke="#3ddc84" stroke-opacity="0.2" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="42" y="49" fill="#f2fff7" font-size="18" font-weight="700" letter-spacing="3">CURRENT FOCUS</text>
    <text x="42" y="72" fill="#82a99a" font-size="12" letter-spacing="1">BUILDING INTELLIGENT AND EFFICIENT ANDROID EXPERIENCES</text>
  </g>

  <rect x="42" y="91" width="250" height="137" rx="17" fill="#102a24" stroke="#3ddc84" stroke-opacity="0.45" />
  <rect x="325" y="91" width="250" height="137" rx="17" fill="#13263a" stroke="#73a7ff" stroke-opacity="0.45" />
  <rect x="608" y="91" width="250" height="137" rx="17" fill="#241d3b" stroke="#b47cff" stroke-opacity="0.45" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle cx="68" cy="119" r="6" fill="#3ddc84" filter="url(#glow)">
      <animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="86" y="125" fill="#3ddc84" font-size="14" font-weight="700">ON-DEVICE AI</text>
    <text x="64" y="157" fill="#e3f5eb" font-size="13">TFLite · ONNX Runtime</text>
    <text x="64" y="181" fill="#8eb4a5" font-size="12">Model · Inference · Deploy</text>
    <rect x="64" y="202" width="204" height="4" rx="2" fill="#29483d" />
    <rect x="64" y="202" height="4" rx="2" fill="#3ddc84">
      <animate attributeName="width" values="20;204;20" dur="4s" repeatCount="indefinite" />
    </rect>

    <circle cx="351" cy="119" r="6" fill="#73a7ff" filter="url(#glow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="369" y="125" fill="#73a7ff" font-size="14" font-weight="700">AUDIO INTELLIGENCE</text>
    <text x="347" y="157" fill="#e5f0ff" font-size="13">Capture · VAD · Denoise</text>
    <text x="347" y="181" fill="#91aac7" font-size="12">Realtime · Codec · Pipeline</text>
    <rect x="347" y="202" width="204" height="4" rx="2" fill="#2b4055" />
    <rect x="347" y="202" height="4" rx="2" fill="#73a7ff">
      <animate attributeName="width" values="50;204;50" dur="4.8s" repeatCount="indefinite" />
    </rect>

    <circle cx="634" cy="119" r="6" fill="#b47cff" filter="url(#glow)">
      <animate attributeName="r" values="8;5;8" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <text x="652" y="125" fill="#b47cff" font-size="14" font-weight="700">ANDROID PERFORMANCE</text>
    <text x="630" y="157" fill="#f1e9ff" font-size="13">Startup · Memory · Power</text>
    <text x="630" y="181" fill="#b1a0c9" font-size="12">Measure · Profile · Optimize</text>
    <rect x="630" y="202" width="204" height="4" rx="2" fill="#403252" />
    <rect x="630" y="202" height="4" rx="2" fill="#b47cff">
      <animate attributeName="width" values="80;204;80" dur="5.2s" repeatCount="indefinite" />
    </rect>
  </g>

  <rect x="0" y="84" width="110" height="1" fill="url(#line)" opacity="0">
    <animate attributeName="x" values="-110;900" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.8;0" dur="5s" repeatCount="indefinite" />
  </rect>
</svg>
